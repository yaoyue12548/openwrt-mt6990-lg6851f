name: Build OpenWrt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget curl swig jq xsltproc libelf-dev \
            device-tree-compiler ccache

      - name: Cache OpenWrt downloads and toolchain
        uses: actions/cache@v4
        with:
          path: |
            dl
            staging_dir/host
            staging_dir/toolchain
          key: openwrt-${{ runner.os }}-${{ hashFiles('.config', 'feeds.conf.default') }}
          restore-keys: |
            openwrt-${{ runner.os }}-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare configuration
        run: make defconfig

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Collect build metadata
        if: always()
        run: |
          mkdir -p artifact
          cp .config artifact/config 2>/dev/null || true
          cp bin/targets/mediatek/mt6990/SHA256SUMS artifact/ 2>/dev/null || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lg6851f-firmware-${{ github.sha }}
          path: |
            bin/targets/mediatek/mt6990/**
            artifact/**
          if-no-files-found: error
          retention-days: 14
